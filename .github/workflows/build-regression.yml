name: MoNoon build and regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  inventorylab:
    name: InventoryLab / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: windows-2022
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The upgrade regression exports the original sample from its v31 commit.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/monoon-dotnet
        with:
          dotnet-version: 10.0.101
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          if ! command -v clang || ! dpkg -s zlib1g-dev >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          fi
      - name: Build Release and Native AOT, replay the quest and compare both saves
        run: >-
          python engine/tests/InventoryLab.Replay/build_guest.py
          game-builds/InventoryLab "${{ runner.temp }}/inventory-replay"
          --expected-rid ${{ matrix.rid }}
      - name: Upload replay saves and build receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: InventoryLab-${{ matrix.rid }}-replay
          path: ${{ runner.temp }}/inventory-replay/
          if-no-files-found: warn
      - name: Check Mac distribution profiles and quest checkpoints
        if: runner.os == 'macOS'
        run: ./monoon test inventorylab game-builds/InventoryLab --profile distribution
      - name: Archive the verified apps with their executable permissions
        if: runner.os == 'macOS'
        run: tar --no-mac-metadata -czf "$RUNNER_TEMP/InventoryLab-osx-arm64.tar.gz" -C game-builds/InventoryLab InventoryLab.app NativeAOT/InventoryLab.app
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: InventoryLab-osx-arm64
          path: ${{ runner.temp }}/InventoryLab-osx-arm64.tar.gz
          if-no-files-found: error

      - name: Archive matching debug symbols
        if: runner.os == 'macOS'
        run: tar --no-mac-metadata -czf "$RUNNER_TEMP/InventoryLab-osx-arm64-symbols.tar.gz" -C game-builds/InventoryLab Symbols
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: InventoryLab-osx-arm64-symbols
          path: ${{ runner.temp }}/InventoryLab-osx-arm64-symbols.tar.gz
          if-no-files-found: error
      - name: Migrate v31 to v35, build both players and finish the quest from v2
        run: >-
          python engine/tests/InventoryLab.Replay/build_guest.py
          game-builds/InventoryLab-upgrade "${{ runner.temp }}/inventory-upgrade"
          --expected-rid ${{ matrix.rid }} --upgrade-from-v31
      - name: Upload upgrade saves and build receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: InventoryLab-${{ matrix.rid }}-upgrade-31-to-35
          path: ${{ runner.temp }}/inventory-upgrade/
          if-no-files-found: warn

  engine:
    name: Engine regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.101
      - name: Prepare the three Release export templates
        run: ./engine/scripts/build-players.sh
      - name: Prepare offscreen Mesa for shader pixel checks
        run: |
          if ! dpkg -s libosmesa6 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libosmesa6
          fi
      - name: Run the full regression suite
        run: ./monoon test

  keyroom-editor:
    name: KeyRoom packaged editor / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
            archive: MoNoon-win-x64.zip
          - runner: ubuntu-24.04
            rid: linux-x64
            archive: MoNoon-linux-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/monoon-dotnet
        with:
          dotnet-version: 10.0.101
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install screenshot support
        run: python -m pip install Pillow==11.3.0
      - name: Prepare X11 desktop and input
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool x11-utils dbus-daemon
      - name: Package the native editor
        run: python engine/scripts/package-editor.py ${{ matrix.rid }} --output "${{ runner.temp }}/packages"
      - name: Package the editable KeyRoom project
        run: python engine/scripts/package-editor.py keyroom --output "${{ runner.temp }}/packages"
      - name: Unpack the distribution editor outside the source checkout
        working-directory: ${{ runner.temp }}
        run: tar -xf "packages/${{ matrix.archive }}"
      - name: Edit, save, reopen and compare Windows Play checkpoints
        if: runner.os == 'Windows'
        run: >-
          python engine/tests/KeyRoom.Desktop/verify_editor.py
          "${{ runner.temp }}/editor/MoNoon.exe" "${{ runner.temp }}/packages/KeyRoom-sample.zip"
          "${{ runner.temp }}/editor-results" --expected-save engine/tests/results/editor-packaging/collected.save
      - name: Edit, save, reopen and compare X11 Play checkpoints
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session --
          python engine/tests/KeyRoom.Desktop/verify_editor.py
          "${{ runner.temp }}/editor/MoNoon" "${{ runner.temp }}/packages/KeyRoom-sample.zip"
          "${{ runner.temp }}/editor-results" --expected-save engine/tests/results/editor-packaging/collected.save
      - name: Upload editor logs, screenshots, scene and F5 saves
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KeyRoom-editor-${{ matrix.rid }}-results
          path: ${{ runner.temp }}/editor-results/
          if-no-files-found: warn
